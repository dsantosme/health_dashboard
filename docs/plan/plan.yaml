stories:
  - id: US-01
    feature: FT-02.1
    story: >-
      Como fundador, quero um CLAUDE.md enxuto e steering base para que qualquer
      agente entenda o produto, a stack e as regras de segurança.
    acceptance_ears:
      - WHEN um agente inicia sessão no repositório THE SYSTEM SHALL carregar ST-01..ST-04 automaticamente
      - WHEN CLAUDE.md exceder 150 linhas THE SYSTEM SHALL falhar o lint de repositório
  - id: US-02
    feature: FT-02.3
    story: >-
      Como fundador, quero hooks que bloqueiem comandos destrutivos para que
      agentes não danifiquem ambientes.
    acceptance_ears:
      - WHEN um agente executar rm -rf, git push --force ou escrita fora de src/ THE SYSTEM SHALL bloquear e registrar
      - WHEN um arquivo for editado THE SYSTEM SHALL executar lint e testes do módulo
  - id: US-03
    feature: FT-03.2
    story: >-
      Como fundador, quero uma lista semanal de 10 contas do ICP com contexto
      para que eu escolha quem contatar.
    acceptance_ears:
      - WHEN for segunda-feira 7h THE SYSTEM SHALL gerar lista com setor, porte, sinal de compra e fonte pública
      - WHEN a conta estiver fora do ICP (ST-06) THE SYSTEM SHALL excluí-la com justificativa
  - id: US-04
    feature: FT-03.3
    story: >-
      Como fundador, quero gerar proposta e minuta a partir das notas da reunião
      para reduzir o tempo de proposta a 1 hora.
    acceptance_ears:
      - WHEN eu enviar notas com escopo e volume THE SYSTEM SHALL produzir proposta PDF, planilha de preço e minuta com cláusulas ST-07
      - WHEN o preço calculado for menor que o piso THE SYSTEM SHALL sinalizar e exigir aprovação
  - id: US-05
    feature: FT-04.1
    story: >-
      Como arquiteto, quero que toda chamada de modelo passe pelo gateway com
      chave por agente para atribuir custo.
    acceptance_ears:
      - WHEN um agente chamar um modelo THE SYSTEM SHALL rotear conforme política (custo, latência, dados regulados) e registrar custo com tag do agente
      - WHEN o modelo primário falhar THE SYSTEM SHALL usar fallback e registrar
  - id: US-06
    feature: FT-04.2
    story: >-
      Como responsável por LGPD, quero PII mascarada em entrada e saída para
      reduzir risco.
    acceptance_ears:
      - WHEN texto contiver CPF, e-mail ou telefone THE SYSTEM SHALL mascarar antes de enviar ao modelo e registrar o evento
      - WHEN a saída contiver PII não presente na entrada THE SYSTEM SHALL bloquear
  - id: US-07
    feature: FT-05.2
    story: >-
      Como usuário do cliente, quero respostas com citação da fonte para confiar
      na informação.
    acceptance_ears:
      - WHEN uma pergunta for respondida via RAG THE SYSTEM SHALL incluir citações com documento e trecho
      - WHEN a confiança for baixa THE SYSTEM SHALL responder que não sabe e sugerir escalonamento
  - id: US-08
    feature: FT-05.3
    story: Como cliente, quero que cada usuário só recupere documentos que pode ver.
    acceptance_ears:
      - WHEN o usuário não tiver permissão no documento THE SYSTEM SHALL excluí-lo da recuperação
      - WHEN houver dados de outro cliente no índice THE SYSTEM SHALL impedir a consulta cruzada
  - id: US-09
    feature: FT-06.1
    story: >-
      Como operador, quero que ações de alto risco exijam aprovação para manter
      controle.
    acceptance_ears:
      - WHEN a ação for classificada como escrita ou irreversível THE SYSTEM SHALL pausar e solicitar aprovação com evidência
      - WHEN não houver resposta em 4 h THE SYSTEM SHALL cancelar e registrar
  - id: US-10
    feature: FT-06.3
    story: >-
      Como CFO do cliente, quero baseline no dia 1 e KPI no dia 45 para ver o
      retorno.
    acceptance_ears:
      - WHEN o pod iniciar THE SYSTEM SHALL registrar baseline (volume, tempo, custo, qualidade)
      - WHEN o pod encerrar THE SYSTEM SHALL gerar relatório antes/depois com custo por resultado
  - id: US-11
    feature: FT-07.1
    story: >-
      Como engenheiro, quero uma suíte de evals com graders de estado para saber
      se o agente fez o trabalho.
    acceptance_ears:
      - WHEN uma tarefa de eval executar THE SYSTEM SHALL verificar o estado final (registro, arquivo, status) e não apenas a resposta
      - WHEN o pass rate cair abaixo do limiar THE SYSTEM SHALL bloquear deploy (HK-04)
  - id: US-12
    feature: FT-08.1
    story: >-
      Como fundador, quero ver custo por resultado por agente para decidir
      roteamento.
    acceptance_ears:
      - WHEN o dia encerrar THE SYSTEM SHALL calcular custo por resultado por agente e caso de uso
      - WHEN o custo diário exceder o orçamento THE SYSTEM SHALL alertar (HK-08)

kpis:
  - { id: KPI-01, area: Negócio, indicator: MRR contratado, target: "R$ 12–20 mil (H180); ≥ R$ 40 mil × 3 meses (H365)" }
  - { id: KPI-02, area: Negócio, indicator: Pods vendidos / entregues, target: "1 / 0 (H30); 2 / 1 (H90); 4 / 3 (H180); 8 / 6 (H365)" }
  - { id: KPI-03, area: Negócio, indicator: Propostas por trimestre, target: "≥ 6" }
  - { id: KPI-04, area: Negócio, indicator: NPS do pod, target: "≥ 8" }
  - { id: KPI-05, area: Plataforma, indicator: "Pass rate de evals (EV-01/02/04)", target: "≥ 95% / 0,85 / 90%" }
  - { id: KPI-06, area: Plataforma, indicator: "Custo por resultado (por caso de uso)", target: "dentro do teto; −30% após otimização" }
  - { id: KPI-07, area: Plataforma, indicator: Reuso entre pods, target: "≥ 50% no pod 2; ≥ 70% no pod 4" }
  - { id: KPI-08, area: Engenharia, indicator: "Lead time por tarefa (AG-03)", target: "< 1 dia para tarefas M" }
  - { id: KPI-09, area: Operação, indicator: Tarefas repetitivas automatizadas, target: "≥ 60% (H180)" }
  - { id: KPI-10, area: Segurança, indicator: "Achados críticos em EV-05", target: "0 em produção" }
  - { id: KPI-11, area: Canais, indicator: Certificações e tiers, target: "CCA-F (H90); AIP-C01 + FinOps (H180); APN/CPN Select (H365)" }
  - { id: KPI-12, area: Pessoal, indicator: Reserva e gatilho de saída, target: "6 meses de reserva + R$ 40 mil/mês × 3" }
