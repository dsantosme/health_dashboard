steering:
  - id: ST-01
    file: product.md
    inclusion: always
    content: "Missão, ICP, ofertas, princípios P-01..P-12, glossário; o 'porquê' de toda decisão."
    since: H30
  - id: ST-02
    file: tech.md
    inclusion: always
    content: >-
      Stack aprovada (Claude Agent SDK, Bedrock AgentCore, MCP, OTel,
      Postgres/pgvector, Python 3.12, TypeScript), versões e proibições.
    since: H30
  - id: ST-03
    file: structure.md
    inclusion: always
    content: >-
      Organização de pastas, nomenclatura de IDs, convenções de commit/PR, onde
      ficam specs, skills e evals.
    since: H30
  - id: ST-04
    file: security.md
    inclusion: always
    content: >-
      Política de risco (leitura/escrita/irreversível), PII/LGPD, segredos,
      testes obrigatórios, hooks de bloqueio.
    since: H30
  - id: ST-05
    file: finops.md
    inclusion: "fileMatch: src/agents/**"
    content: >-
      Orçamento de tokens por agente, roteamento padrão, cache, métricas de
      custo obrigatórias.
    since: H60
  - id: ST-06
    file: icp-e-vendas.md
    inclusion: manual
    content: ICP, sinais de compra, tom de comunicação comercial, faixas de preço, objeções.
    since: H30
  - id: ST-07
    file: contratos.md
    inclusion: manual
    content: >-
      Cláusulas-padrão (LGPD, IA, PI, limitação de responsabilidade), termos de
      pagamento.
    since: H30
  - id: ST-08
    file: operacao-cliente.md
    inclusion: "fileMatch: clients/**"
    content: >-
      Regras de operação em ambiente de cliente: somente leitura por padrão,
      janelas de mudança, comunicação.
    since: H90
  - id: ST-09
    file: estilo-pt-br.md
    inclusion: "fileMatch: content/**"
    content: >-
      Tom, vocabulário e formatação de conteúdo em português do Brasil; o que
      nunca prometer.
    since: H60
  - id: ST-10
    file: "client-<slug>.md (por cliente)"
    inclusion: "fileMatch: clients/<slug>/**"
    content: "Contexto do cliente: sistemas, glossário, políticas, contatos, restrições, KPIs do pod."
    since: H60

hooks:
  - { id: HK-01, event: PreToolUse (Bash), action: "Bloqueia comandos destrutivos e escrita fora do diretório do pod.", since: H30 }
  - { id: HK-02, event: PostToolUse (Edit), action: "Roda lint/format e testes unitários do arquivo alterado.", since: H30 }
  - { id: HK-03, event: Stop, action: "Impede encerrar a tarefa sem testes verdes, evals mínimos e ADR quando houver decisão.", since: H60 }
  - { id: HK-04, event: PreToolUse (deploy), action: "Exige pass rate de EV-01/EV-02 ≥ limiar e orçamento de custo aprovado.", since: H60 }
  - { id: HK-05, event: PostToolUse (MCP escrita), action: "Registra auditoria (quem, o quê, quando, custo) em log imutável.", since: H60 }
  - { id: HK-06, event: SessionStart, action: "Carrega progresso (progress.md), git log recente e steering do cliente ativo.", since: H90 }
  - { id: HK-07, event: PreToolUse (dados de cliente), action: "Verifica ACL e mascaramento de PII antes de consultar RAG/warehouse.", since: H90 }
  - { id: HK-08, event: Notification/Alert, action: "Envia alerta ao fundador quando custo diário > orçamento ou eval cai abaixo do limiar.", since: H60 }

harness:
  - { id: HR-01, component: Intenção e contexto, implementation: "CLAUDE.md enxuto + steering por inclusão + skills com divulgação progressiva.", related: [ST-01, SK-01] }
  - { id: HR-02, component: Ferramentas, implementation: "MCP servers com descrições ricas, erros acionáveis e escopos mínimos; code execution para dados grandes.", related: [MOD-00, MOD-04] }
  - { id: HR-03, component: Permissões e sandbox, implementation: "Modo de permissão por risco; sandbox de rede/arquivo; segredos fora do contexto.", related: [ST-04, HK-01] }
  - { id: HR-04, component: Memória e progresso, implementation: "progress.md, feature list e notas estruturadas em arquivo; retomada por git log.", related: [PR-11, HK-06] }
  - { id: HR-05, component: Gates determinísticos, implementation: "Hooks de Stop/PreToolUse com testes, evals e orçamento como condição de término.", related: [HK-03, HK-04] }
  - { id: HR-06, component: Segunda opinião, implementation: "Subagentes revisores (segurança, custo, testes) que tentam refutar o resultado.", related: [AG-04, PR-05] }
  - { id: HR-07, component: Observabilidade e custo, implementation: "Traços OTel por ferramenta, custo por resultado, alertas.", related: [MOD-05, MOD-06] }
  - { id: HR-08, component: Humano no loop, implementation: "Pontos de aprovação por risco; evidência obrigatória (logs, testes, capturas).", related: [P-07] }
  - { id: HR-09, component: Versionamento, implementation: "Prompts, steering, skills e suítes de eval versionados junto com o código; changelog por agente.", related: [ST-03] }

evals:
  - { id: EV-01, target: Engenharia (pods), measures: "Tarefas de código do pod: testes passam, arquivos corretos, sem dano colateral.", grader: determinístico (estado), threshold: "≥ 95%", cadence: cada PR, since: H60 }
  - { id: EV-02, target: RAG e conhecimento, measures: "recall@k, fidelidade e citação correta em 50 perguntas reais do cliente.", grader: determinístico + LLM-judge calibrado, threshold: "recall@5 ≥ 0,85; fidelidade ≥ 0,9", cadence: diário, since: H60 }
  - { id: EV-03, target: Qualidade de código gerado, measures: "Revisão automática: segurança, complexidade, cobertura.", grader: LLM-judge + linters, threshold: sem achados críticos, cadence: cada PR, since: H60 }
  - { id: EV-04, target: Agentes de cliente (AT-*), measures: "Tarefas ponta a ponta com verificação de estado (registro criado, status correto, handoff).", grader: determinístico (estado) + humano amostral, threshold: "≥ 90% e 0 ações proibidas", cadence: cada deploy + semanal, since: H90 }
  - { id: EV-05, target: Segurança de IA, measures: "Bateria OWASP LLM Top 10 / ATLAS: injeção, exfiltração, abuso de ferramenta.", grader: determinístico, threshold: 0 críticos, cadence: cada deploy, since: H180 }
  - { id: EV-06, target: "Agentes comerciais (AG-01, AG-02, AG-08)", measures: "Qualidade de propostas/listas contra rubrica; nada enviado sem aprovação.", grader: LLM-judge + humano, threshold: "≥ 4/5 na rubrica", cadence: semanal, since: H60 }
  - { id: EV-07, target: "Agentes operacionais (AG-00, AG-05, AG-07, AG-09)", measures: "Precisão de custo, alertas corretos, zero pagamentos sem aprovação.", grader: determinístico, threshold: 100% em ações críticas, cadence: diário, since: H90 }
  - { id: EV-08, target: Custo e latência, measures: "Custo por resultado e p95 por agente dentro do orçamento.", grader: determinístico, threshold: dentro do teto por agente, cadence: contínuo, since: H90 }

