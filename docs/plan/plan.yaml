# ORBE — plano operacional (fonte de verdade para agentes).
# Gerado em 2026-09-05 a partir de "Plano Operacional 30/60/90/180/365 — ORBE".
# NUNCA invente IDs. Proponha novos em docs/plan/proposed.yaml para aprovação humana.
# Validação: pnpm orbe:validate
meta:
  plan: Plano Operacional 30/60/90/180/365
  codename: ORBE
  version: "1.0"
  date: "2026-09-05"
  language: pt-BR
  owner: Denis Santos (fundador técnico)
  company: "[EMPRESA — a definir]"
  id_conventions:
    H: horizonte
    P: princípio
    PR: prática
    MOD: módulo da plataforma
    F: funcionalidade
    AG: agente interno
    AT: template de agente para cliente
    SK: skill (SKILL.md)
    ST: steering
    HK: hook
    HR: componente do harness
    EV: suíte de evals
    EP: épico
    FT: feature
    US: user story
    KPI: indicador

horizons:
  - id: H30
    name: 30 dias
    window: dias 1–30
    theme: Fundar, instrumentar e vender o primeiro pod
    exit:
      - Empresa aberta e programas de créditos/parcerias inscritos
      - CLAUDE.md, steering base e 4 skills operando
      - Gateway + guardrails v0.1 em uma conta de laboratório
      - 2 propostas enviadas; 1 pod assinado
  - id: H60
    name: 60 dias
    window: dias 31–60
    theme: Primeiro pod em produção com evals e custo medidos
    exit:
      - Pod 1 em produção com baseline e painel de custo
      - RAG v0.1 com ACL e citações
      - Suíte de evals EV-01/EV-02 rodando em CI
      - Agente de prospecção e de proposta em uso semanal
  - id: H90
    name: 90 dias
    window: dias 61–90
    theme: "Repetir: segundo pod, template AT-01 e KPI publicado"
    exit:
      - Relatório KPI antes/depois do pod 1 entregue ao cliente
      - Pod 2 assinado (segundo setor)
      - AT-01 Atendimento N1 como template reutilizável
      - CCA-F obtida; registro APN e Claude Partner Network ativos
  - id: H180
    name: 180 dias
    window: dias 91–180
    theme: Plataforma v1, sócio comercial testado, produto FinOps em beta
    exit:
      - MRR ≥ R$ 20 mil; 3 pods entregues; 1 retainer
      - MOD-05/06 v1 (evals contínuos + custo por resultado)
      - Sócio comercial validado em comissão
      - AIP-C01 e FinOps Practitioner; CAISP iniciada
  - id: H365
    name: 365 dias
    window: dias 181–365
    theme: "Escala: APN/CPN Select, produto em assinatura, gatilho de saída"
    exit:
      - MRR ≥ R$ 40 mil por 3 meses; reserva ≥ 6 meses (gatilho de saída)
      - APN Select e CPN Select
      - Painel FinOps de IA em assinatura com ≥ 5 clientes
      - AI Security Assessment lançado; 2 cases públicos

principles:
  - id: P-01
    name: Agentes são usuários
    description: >-
      Toda API, documento e ferramenta é desenhada para ser consumida por
      agentes (MCP, descrições ricas, erros acionáveis).
  - id: P-02
    name: Spec é a fonte da verdade
    description: >-
      Requisitos (EARS), design e tarefas em arquivos versionados; código deriva
      da spec, não o contrário.
  - id: P-03
    name: Evals são os testes
    description: >-
      Nenhum agente vai a produção sem suíte de evals com gate; falhas de
      produção viram novos casos.
  - id: P-04
    name: Contexto é o produto
    description: >-
      Divulgação progressiva: só o necessário entra no contexto; skills,
      steering e RAG cuidam do resto.
  - id: P-05
    name: Hooks garantem, prompts pedem
    description: >-
      O que precisa acontecer sempre vai em hook/política, não em instrução.
  - id: P-06
    name: Custo é uma feature
    description: >-
      Cada agente tem orçamento de tokens e custo por resultado visível desde o
      primeiro dia.
  - id: P-07
    name: Humano no loop por risco
    description: >-
      Ações irreversíveis ou de alto impacto exigem aprovação; o resto é
      auditado.
  - id: P-08
    name: Modular e substituível
    description: >-
      Cada módulo tem interface (MCP/contrato) e pode ser trocado por serviço
      nativo da nuvem.
  - id: P-09
    name: Observável por padrão
    description: >-
      Traços OpenTelemetry, custo e qualidade emitidos por todo agente e
      ferramenta.
  - id: P-10
    name: Transferência, não dependência
    description: >-
      Runbooks, knowledge graph e time treinado são entregáveis de todo pod.
  - id: P-11
    name: Comprar antes de construir
    description: >-
      Plataformas de nuvem como base; IP próprio só em evals, custo e integração
      vertical.
  - id: P-12
    name: Dogfooding
    description: >-
      A empresa opera com os mesmos módulos que vende; cada agente interno é um
      protótipo vendável.

practices:
  - id: PR-01
    name: Spec-driven development
    how: >-
      requirements.md (EARS) → design.md → tasks.md por feature; agente
      implementa tarefa a tarefa com verificação.
    since: H30
  - id: PR-02
    name: Evals-first
    how: >-
      Definir 20–50 tarefas de eval por agente antes de construir; grader por
      estado/resultado; suíte em CI.
    since: H60
  - id: PR-03
    name: Harness engineering
    how: >-
      Humanos desenham ambiente, intenção e feedback; agentes implementam via
      PR + CI; hooks como gates.
    since: H30
  - id: PR-04
    name: Context engineering
    how: >-
      Steering por inclusão (always/fileMatch/manual), skills com divulgação
      progressiva, memória em arquivos.
    since: H30
  - id: PR-05
    name: Revisão de PR por agente + humano
    how: >-
      Subagente revisor (segurança, custo, testes) antes do humano; evidência
      obrigatória (logs, testes).
    since: H60
  - id: PR-06
    name: Medição DORA/SPACE + evals + custo
    how: >-
      Painel único: lead time, deploy frequency, change failure, pass rate de
      evals, custo por resultado.
    since: H90
  - id: PR-07
    name: Reuniões operadas por agente
    how: >-
      Notas, decisões e ações extraídas automaticamente para o backlog e para a
      base de conhecimento.
    since: H60
  - id: PR-08
    name: ADRs gerados e revisados
    how: >-
      Toda decisão de arquitetura vira ADR curto, proposto pelo agente e
      aprovado pelo humano.
    since: H30
  - id: PR-09
    name: Segurança contínua de agentes
    how: >-
      Testes de prompt injection e exfiltração em cada deploy (OWASP LLM Top 10,
      MITRE ATLAS).
    since: H180
  - id: PR-10
    name: Orçamento por feature
    how: >-
      Cada épico/feature declara teto de tokens/custo; estouro bloqueia merge
      até revisão.
    since: H90
  - id: PR-11
    name: Long-running agents com progresso em arquivo
    how: >-
      Agente inicializador cria script, lista de features e arquivo de
      progresso; sessões retomam pelo git log.
    since: H90
  - id: PR-12
    name: Case como artefato
    how: >-
      Todo pod termina com KPI antes/depois e case anônimo — insumo para vendas,
      parceiros e certificações.
    since: H90

modules:
  - id: MOD-00
    name: Fundação e integração
    purpose: >-
      Conectar sistemas do cliente e dados prontos para IA via MCP servers, APIs
      e eventos.
    buy_build: Construir (IP setorial)
    base_tech: [MCP servers (Python/TypeScript), API Gateway, EventBridge/SQS, Postgres]
    features:
      - { id: F-00.1, name: MCP server genérico para REST/SQL com autenticação, horizon: H30 }
      - { id: F-00.2, name: Catálogo de conectores por setor (ERP, WMS/TMS, CRM), horizon: H180 }
      - { id: F-00.3, name: Identidade e escopos (OAuth/Entra) por ferramenta, horizon: H90 }
  - id: MOD-01
    name: AI Gateway
    purpose: Roteamento multi-modelo, cache, chaves, cotas e fallback.
    buy_build: Comprar; configurar
    base_tech: [Bedrock (Claude, Nova), Azure AI Foundry, roteador por custo/qualidade, cache de prompt]
    features:
      - { id: F-01.1, name: Roteamento por política (custo, latência, dados regulados), horizon: H30 }
      - { id: F-01.2, name: Cache e batch para cargas repetitivas, horizon: H60 }
      - { id: F-01.3, name: Multi-nuvem e open-weight sob política de dados, horizon: H180 }
  - id: MOD-02
    name: Guardrails e segurança
    purpose: Proteção de entrada/saída, políticas e auditoria.
    buy_build: Comprar + módulo próprio de testes
    base_tech: [Bedrock Guardrails, políticas CEDAR/OPA, detecção de PII, log de auditoria]
    features:
      - { id: F-02.1, name: PII/LGPD em entrada e saída, horizon: H30 }
      - { id: F-02.2, name: Políticas por risco (leitura/escrita/irreversível), horizon: H60 }
      - { id: F-02.3, name: Testes contínuos de prompt injection e exfiltração, horizon: H180 }
  - id: MOD-03
    name: Conhecimento (RAG)
    purpose: Recuperação com permissões, citações e qualidade medida.
    buy_build: Comprar base; construir modelagem
    base_tech: [S3 + OpenSearch/pgvector, busca híbrida (BM25+vetor), reranker, Bedrock Knowledge Bases]
    features:
      - { id: F-03.1, name: Ingestão e chunking por tipo de documento, horizon: H30 }
      - { id: F-03.2, name: Recuperação com ACL e citações, horizon: H60 }
      - { id: F-03.3, name: Evals de recuperação (recall@k, fidelidade), horizon: H90 }
      - { id: F-03.4, name: Grafo de contexto e memória por agente, horizon: H180 }
  - id: MOD-04
    name: Orquestração de agentes
    purpose: Workflows, ferramentas via MCP, memória e humano-no-loop.
    buy_build: Comprar (AgentCore/Agent SDK) + padrões próprios
    base_tech: [Claude Agent SDK, Bedrock AgentCore, Step Functions, MCP]
    features:
      - { id: F-04.1, name: Padrão de agente único com HITL por risco, horizon: H30 }
      - { id: F-04.2, name: Multiagente por etapa com aprovação, horizon: H90 }
      - { id: F-04.3, name: Agentes de longa duração com progresso em arquivo, horizon: H180 }
  - id: MOD-05
    name: Evals e observabilidade
    purpose: Qualidade, traços e SLOs de agentes; gate de deploy.
    buy_build: Construir (IP central)
    base_tech: [OpenTelemetry, Bedrock Evaluations, LangSmith/Braintrust, Grafana]
    features:
      - { id: F-05.1, name: Suíte de evals com graders determinísticos e LLM-judge, horizon: H60 }
      - { id: F-05.2, name: Traços por chamada de ferramenta e custo, horizon: H60 }
      - { id: F-05.3, name: Evals contínuos em produção e alertas, horizon: H180 }
      - { id: F-05.4, name: Benchmark setorial (mobilidade/logística/varejo), horizon: H365 }
  - id: MOD-06
    name: FinOps de IA
    purpose: Custo por resultado, showback, alertas e otimização por agente.
    buy_build: Construir (IP central)
    base_tech: [FOCUS, Cost Explorer/Azure Cost, painel próprio, roteador de custo]
    features:
      - { id: F-06.1, name: Custo por caso de uso e por resultado, horizon: H60 }
      - { id: F-06.2, name: Showback/chargeback e alertas de estouro, horizon: H90 }
      - { id: F-06.3, name: Produto de assinatura multi-cliente, horizon: H180 }
      - { id: F-06.4, name: Otimização automática (roteamento, cache, batch), horizon: H365 }
  - id: MOD-07
    name: Casos de uso verticais
    purpose: Templates de agentes prontos para setores-alvo.
    buy_build: Construir sobre as camadas
    base_tech: [AT-01..AT-05, conectores MOD-00]
    features:
      - { id: F-07.1, name: AT-01 Atendimento nível 1, horizon: H90 }
      - { id: F-07.2, name: AT-02 Back-office financeiro, horizon: H180 }
      - { id: F-07.3, name: AT-03 Operações/logística, horizon: H180 }
      - { id: F-07.4, name: AT-04 Engenharia e AT-05 Dados, horizon: H365 }
  - id: MOD-08
    name: Harness e steering (runtime de desenvolvimento)
    purpose: >-
      Ambiente onde os agentes constroem e operam a plataforma: CLAUDE.md,
      steering, skills, hooks, subagentes.
    buy_build: Construir (arquivos) sobre Claude Code/Kiro
    base_tech: [Claude Code, Kiro (specs/steering), Agent Skills (agentskills.io), hooks]
    features:
      - { id: F-08.1, name: CLAUDE.md e .kiro/steering base, horizon: H30 }
      - { id: F-08.2, name: Skills SK-01..SK-06, horizon: H30 }
      - { id: F-08.3, name: Hooks de gate (testes, evals, custo), horizon: H60 }
      - { id: F-08.4, name: Subagentes revisores (segurança, custo), horizon: H60 }
  - id: MOD-09
    name: Portal e entregáveis
    purpose: Painéis, runbooks, knowledge graph exportável e relatório KPI.
    buy_build: Construir (leve)
    base_tech: [Next.js/React, Grafana, geração de PDF, export JSON/Markdown]
    features:
      - { id: F-09.1, name: Relatório KPI antes/depois automatizado, horizon: H60 }
      - { id: F-09.2, name: Runbook e knowledge graph exportáveis, horizon: H90 }
      - { id: F-09.3, name: Portal do cliente (custos, qualidade, agentes), horizon: H180 }

agents:
  - id: AG-00
    name: Orquestrador (chefe de gabinete)
    purpose: >-
      Recebe demandas, roteia para agentes, produz o briefing diário e mantém o
      backlog sincronizado.
    triggers: [cron diário 7h, mensagem do fundador, evento de agente]
    inputs: [backlog, agenda, métricas]
    outputs: [briefing, tarefas roteadas, alertas]
    tools: ["MCP: backlog (GitHub/Linear)", "MCP: agenda", "MCP: métricas"]
    skills: [SK-11]
    steering: [ST-01, ST-02]
    guardrails: [sem escrita externa]
    hitl: Aprovação para criar compromissos
    evals: [EV-07]
    kpis: [tarefas roteadas/dia, tempo até ação]
    horizon: H60
    kind: internal
  - id: AG-01
    name: Prospecção e inteligência de mercado
    purpose: >-
      Mapeia ICP, vagas, cases e expositores; entrega lista semanal com contexto
      por conta.
    triggers: [cron semanal, evento de novo lead]
    inputs: [ICP (ST-06), CRM, web]
    outputs: [lista priorizada, notas de conta, gatilhos de compra]
    tools: ["MCP: CRM", web_search, "MCP: LinkedIn export"]
    skills: [SK-11, SK-10]
    steering: [ST-01, ST-06]
    guardrails: [não contata ninguém, "LGPD: só dados públicos"]
    hitl: Aprovação antes de qualquer contato
    evals: [EV-06]
    kpis: [contas qualificadas/semana, taxa de conversão em conversa]
    horizon: H30
    kind: internal
  - id: AG-02
    name: Proposta, precificação e contratos
    purpose: >-
      Gera proposta a partir de template e notas; precifica com a calculadora;
      redige contrato com cláusulas LGPD/IA.
    triggers: [notas de reunião, pedido do fundador]
    inputs: [template, calculadora (Parte VIII do dossiê), notas]
    outputs: [proposta PDF, planilha de preço, minuta de contrato]
    tools: ["MCP: documentos", calculadora (script), assinatura eletrônica]
    skills: [SK-05, SK-06]
    steering: [ST-01, ST-07]
    guardrails: [nunca envia sem aprovação, faixa de preço mínima]
    hitl: Aprovação obrigatória (sempre)
    evals: [EV-06]
    kpis: [tempo de proposta, taxa de aceite]
    horizon: H30
    kind: internal
  - id: AG-03
    name: Entrega (builder de pods)
    purpose: >-
      Faz scaffolding do pod, MCP servers, testes, documentação e runbook;
      propõe melhorias.
    triggers: [tarefa do backlog, spec aprovada]
    inputs: [requirements.md, design.md, tasks.md]
    outputs: [PRs, runbook, knowledge graph]
    tools: [Claude Code, Kiro, Agent SDK, "MCP: repositório"]
    skills: [SK-01, SK-02, SK-07, SK-12]
    steering: [ST-01, ST-02, ST-03, ST-04, ST-05]
    guardrails: [hooks HK-01..HK-04, sem deploy direto]
    hitl: Revisão de PR por humano
    evals: [EV-01, EV-03]
    kpis: [lead time por tarefa, PRs aprovados sem retrabalho]
    horizon: H30
    kind: internal
  - id: AG-04
    name: Evals e QA
    purpose: >-
      Roda suítes de eval, testes de segurança e regressões; bloqueia deploy se
      falhar; abre issues.
    triggers: [PR aberto, deploy, cron noturno]
    inputs: [suítes EV, traços]
    outputs: [relatório de eval, issues, gate pass/fail]
    tools: [Bedrock Evaluations, LangSmith/Braintrust, OTel, "MCP: CI"]
    skills: [SK-03, SK-08]
    steering: [ST-01, ST-04]
    guardrails: [somente leitura em produção]
    hitl: Não (bloqueia automaticamente)
    evals: [EV-01, EV-02, EV-05]
    kpis: [pass rate, regressões detectadas antes de produção]
    horizon: H60
    kind: internal
  - id: AG-05
    name: FinOps (cliente e próprio)
    purpose: >-
      Coleta custo de tokens/cloud; calcula custo por resultado; alerta e sugere
      roteamento/cache.
    triggers: [cron diário, estouro de orçamento]
    inputs: [FOCUS, Cost Explorer, traços]
    outputs: [painel, alertas, recomendações]
    tools: ["MCP: billing", "MCP: OTel", painel]
    skills: [SK-04, SK-12]
    steering: [ST-01, ST-08]
    guardrails: [não altera configuração sem aprovação]
    hitl: Aprovação para mudanças de roteamento
    evals: [EV-07]
    kpis: [custo por resultado, economia realizada]
    horizon: H60
    kind: internal
  - id: AG-06
    name: Curador de conhecimento
    purpose: >-
      Indexa playbooks, cases, decisões e fontes; responde ao time; alimenta
      propostas e RAG dos pods.
    triggers: [novo documento, pergunta do time]
    inputs: [repositório de conhecimento, dossiê]
    outputs: [índice, respostas com citação, lacunas]
    tools: [MOD-03, "MCP: documentos"]
    skills: [SK-10]
    steering: [ST-01]
    guardrails: [ACL por cliente, sem mistura de dados entre clientes]
    hitl: Não
    evals: [EV-02]
    kpis: [recall@k, fidelidade das respostas]
    horizon: H60
    kind: internal
  - id: AG-07
    name: Back-office (financeiro e administrativo)
    purpose: Emissão de NF, conciliação, cobrança, contratos PJ, agenda e obrigações.
    triggers: [marco de contrato, cron mensal]
    inputs: [contratos, extrato, calendário fiscal]
    outputs: [NF emitida, lembretes, conciliação]
    tools: ["MCP: contador/ERP leve", "MCP: banco (leitura)", Google Workspace]
    skills: [SK-06]
    steering: [ST-01, ST-07]
    guardrails: [nenhum pagamento sem aprovação]
    hitl: Aprovação para pagamentos e NF
    evals: [EV-07]
    kpis: [atrasos evitados, horas poupadas/mês]
    horizon: H90
    kind: internal
  - id: AG-08
    name: Marketing e conteúdo
    purpose: >-
      Rascunha newsletter quinzenal, posts e cases a partir de KPIs e fontes;
      mantém calendário editorial.
    triggers: [cron quinzenal, novo case]
    inputs: [cases, dossiê, calendário]
    outputs: [rascunhos, imagens simples, métricas]
    tools: ["MCP: documentos", "MCP: LinkedIn (rascunho)"]
    skills: [SK-10]
    steering: [ST-01, ST-09]
    guardrails: [nunca publica sozinho]
    hitl: Aprovação de tom e publicação
    evals: [EV-06]
    kpis: [publicações/mês, leads originados]
