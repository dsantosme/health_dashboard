    triggers: [alerta de eval/custo, ticket do cliente, cron semanal]
    inputs: [traços, tickets, SLOs]
    outputs: [resumo de incidentes, plano de melhoria, relatório mensal]
    tools: [MOD-05, MOD-06, "MCP: tickets"]
    skills: [SK-07, SK-04]
    steering: [ST-01, ST-08]
    guardrails: [somente leitura em ambiente do cliente]
    hitl: Aprovação para mudanças em produção
    evals: [EV-07]
    kpis: [MTTR, NPS]
    horizon: H180
    kind: internal
  - id: AG-10
    name: Red team de IA
    purpose: >-
      Executa testes ofensivos contínuos (prompt injection, exfiltração via RAG,
      abuso de ferramentas/MCP) e reporta.
    triggers: [deploy, cron semanal]
    inputs: [OWASP LLM Top 10, MITRE ATLAS, ambiente de teste]
    outputs: [relatório, casos novos para EV-05]
    tools: [ambiente isolado, SK-08]
    skills: [SK-08]
    steering: [ST-04]
    guardrails: [só em ambiente de teste, nunca em produção sem janela]
    hitl: Aprovação para testes em cliente
    evals: [EV-05]
    kpis: [vulnerabilidades encontradas/corrigidas]
    horizon: H180
    kind: internal
  - id: AT-01
    name: Atendimento nível 1
    purpose: >-
      Resolve dúvidas de nível 1 com base na base de conhecimento e sistemas do
      cliente; escala com contexto.
    triggers: [mensagem do cliente final]
    inputs: [RAG do cliente, sistemas (MCP)]
    outputs: [resposta com citação, escalonamento, métricas]
    tools: [MOD-03, "MCP: CRM/ERP", MOD-02]
    skills: [SK-07]
    steering: [ST-10]
    guardrails: [PII, sem promessas comerciais, handoff por confiança]
    hitl: Escalonamento para humano abaixo do limiar
    evals: [EV-02, EV-04]
    kpis: [taxa de resolução, tempo de resposta, CSAT]
    horizon: H90
    kind: client
  - id: AT-02
    name: Back-office financeiro
    purpose: >-
      Concilia, classifica e prepara lançamentos; responde a fornecedores;
      sinaliza exceções.
    triggers: [arquivo/e-mail recebido, cron]
    inputs: [ERP, extratos, políticas]
    outputs: [lançamentos propostos, exceções, relatório]
    tools: ["MCP: ERP", "MCP: e-mail"]
    skills: [SK-07]
    steering: [ST-10]
    guardrails: [nenhum lançamento sem aprovação]
    hitl: Aprovação por lote
    evals: [EV-04]
    kpis: [horas poupadas, erros evitados]
    horizon: H180
    kind: client
  - id: AT-03
    name: Operações e logística (exceções)
    purpose: >-
